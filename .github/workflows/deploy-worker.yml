name: Deploy MCP Worker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Verify checkout and TypeScript dependencies
        run: |
          git rev-parse HEAD
          bun --version
          bun pm ls @types/node
          node -e "const c=require('./tsconfig.json'); console.log(c.compilerOptions.types)"
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Verify npm tarball contents
        shell: bash
        run: |
          package_path="$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" | tail -n 1)"
          tar -tf "$RUNNER_TEMP/$package_path" | grep -E '(^|/)dist/src/index\.js$|(^|/)scripts/install-skills\.mjs$|(^|/)skills/.*\.md$'

  deploy:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
